[tool.poetry]
name = "nse-options-ml-pro"
version = "0.1.0"
description = "NIFTY50 Options Analysis & Neural Network Prediction Pipeline"
authors = ["OpenClaw <dev@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.24"
pandas = "^2.0"
torch = "^2.0"
pytorch-lightning = "^2.0"
scikit-learn = "^1.2"
scipy = "^1.10"
yfinance = "^0.2"
pandas-ta = "^0.3"
streamlit = "^1.25"
optuna = "^3.0"
mlflow = "^2.0"
joblib = "^1.3"
python-dotenv = "^1.0"
matplotlib = "^3.7"
plotly = "^5.15"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
black = "^23.0"
isort = "^5.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
